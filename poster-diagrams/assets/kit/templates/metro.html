<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Plan de métro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="kit.css">
<style>
  .node.bare h3 { font-size: 15px; }
  .node.bare p { font-size: 13px; margin-top: 3px; }
  svg.metro { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }
  .line-name { position: absolute; font-weight: 800; font-size: 15px; line-height: 20px; white-space: nowrap; }
  .line-name span { font-weight: 600; color: var(--muted); }
</style>
</head>
<body>
<!--
  Gabarit « métro » : une ou deux lignes de stations, la seconde revient de droite à gauche
  après un virage. Pour raconter un pipeline, un parcours d'utilisateur, une procédure.
  Les stations se déclarent dans LINES ; `highlight` remplit une station clé de l'encre de sa ligne.
-->
<div class="board" style="--w:1600px; --h:820px">
  <div class="head">
    <h1>D'une inscription<br><span class="second">au premier achat</span></h1>
    <p>Le parcours d'un nouveau client, étape par étape. Chaque station est un écran ou un message ; les stations pleines sont celles où l'on perd le plus de monde.</p>
  </div>

  <div class="stage" id="stage">
    <div class="line-name" style="left:64px; top:236px; color:var(--accent-ink)">Découverte <span>· le premier jour</span></div>
    <div class="line-name" style="left:64px; top:500px; color:var(--accent-2-ink)">Conversion <span>· la première semaine</span></div>
  </div>

  <div class="brand"><span>Gabarit métro</span></div>
</div>

<script>
  const LINES = [
    {
      y: 300,
      color: 'accent',
      highlight: [4],
      stations: [
        ['Annonce', 'Un lien partagé sur un réseau.'],
        ['Page d\'accueil', 'Une promesse, une capture réelle.'],
        ['Inscription', 'E-mail ou compte existant.'],
        ['Confirmation', 'Un lien valable une heure.'],
        ['Profil', 'Trois questions, toutes facultatives.'],
        ['Premier usage', 'Un exemple prérempli.'],
      ],
    },
    {
      y: 564,
      color: 'accent2',
      reverse: true,
      highlight: [2],
      stations: [
        ['Rappel', 'Un e-mail le troisième jour.'],
        ['Retour', 'Le travail laissé en cours.'],
        ['Limite', 'L\'offre gratuite atteinte.'],
        ['Offre', 'Deux formules, pas plus.'],
        ['Paiement', 'Sur la page du prestataire.'],
        ['Bienvenue', 'Reçu et premiers conseils.'],
      ],
    },
  ];
  const X0 = 96;
  const X1 = 1356;
  const TURN = 1536;
  const LABEL_WIDTH = 170;

  const root = document.documentElement;
  const css = (name) => getComputedStyle(root).getPropertyValue(name).trim();
  const lineColor = { accent: css('--accent'), accent2: css('--accent-2') };
  const ink = css('--ink');
  const card = css('--card');
  const stage = document.getElementById('stage');

  const positions = LINES.map((line, li) => {
    const step = (X1 - X0) / (line.stations.length - 1);
    const width = Math.min(LABEL_WIDTH, step - 16);
    return line.stations.map(([title, text], i) => {
      const x = line.reverse ? X1 - i * step : X0 + i * step;
      const label = document.createElement('div');
      label.className = 'node bare';
      label.dataset.id = `l${li + 1}s${i + 1}`;
      label.style.cssText = `left:${x - 12}px; top:${line.y + 30}px; width:${width}px`;
      label.innerHTML = `<h3>${title}</h3><p>${text}</p>`;
      stage.appendChild(label);
      return x;
    });
  });

  const r = 40;
  let svg = `<svg class="metro" viewBox="0 0 1600 ${parseInt(getComputedStyle(document.querySelector('.board')).height)}" xmlns="http://www.w3.org/2000/svg">`;
  const [a, b] = LINES;
  svg += `<path d="M ${X0} ${a.y} L ${TURN - r} ${a.y} Q ${TURN} ${a.y} ${TURN} ${a.y + r}" fill="none" stroke="${lineColor[a.color]}" stroke-width="10" stroke-linecap="round"/>`;
  if (b) {
    svg += `<path d="M ${TURN} ${a.y + r} L ${TURN} ${b.y - r} Q ${TURN} ${b.y} ${TURN - r} ${b.y} L ${X0} ${b.y}" fill="none" stroke="${lineColor[b.color]}" stroke-width="10" stroke-linecap="round"/>`;
  }
  LINES.forEach((line, li) => {
    positions[li].forEach((x, i) => {
      const lit = (line.highlight || []).includes(i + 1);
      const fill = lit ? lineColor[line.color] : card;
      const text = lit && line.color === 'accent2' ? css('--on-accent-2') : ink;
      svg += `<circle cx="${x}" cy="${line.y}" r="15" fill="${fill}" stroke="${ink}" stroke-width="3"/>`;
      svg += `<text x="${x}" y="${line.y + 4.5}" text-anchor="middle" font-family="${css('--font-title').replace(/"/g, "'")}" font-size="13" fill="${text}">${i + 1}</text>`;
    });
  });
  svg += '</svg>';
  stage.insertAdjacentHTML('afterbegin', svg);

  window.LEGEND = [
    { color: 'accent', label: 'découverte', thick: true },
    { color: 'accent2', label: 'conversion', thick: true },
  ];
</script>
<script src="wire.js"></script>
</body>
</html>
